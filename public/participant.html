<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Demande de Musique</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 1.25rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
            font-weight: 400;
        }

        .event-info {
            background: rgba(255, 255, 255, 0.1);
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
        }

        .event-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .event-date {
            opacity: 0.8;
            font-size: 0.875rem;
        }

        .form-container {
            padding: 2rem 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--surface);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .submit-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            background: #f0fdf4;
            color: var(--success-color);
            padding: 1rem;
            border-radius: var(--radius);
            margin-top: 1.5rem;
            text-align: center;
            display: none;
            border: 1px solid #bbf7d0;
            font-size: 0.875rem;
        }

        .error-message {
            background: #fef2f2;
            color: var(--danger-color);
            padding: 1rem;
            border-radius: var(--radius);
            margin-top: 1.5rem;
            text-align: center;
            display: none;
            border: 1px solid #fecaca;
            font-size: 0.875rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            background: var(--background);
        }

        @media (max-width: 600px) {
            body {
                padding: 0.75rem;
            }
            
            .container {
                margin: 0;
                border-radius: var(--radius);
            }
            
            .header {
                padding: 1.5rem 1rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .form-container {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Demande de Musique</h1>
            <p>Suggérez votre chanson préférée au DJ</p>
            
            <div class="event-info" id="eventInfo" style="display: none;">
                <div class="event-name" id="eventName"></div>
                <div class="event-date" id="eventDate"></div>
                <div class="event-date" id="eventLocation"></div>
                <div class="event-date" id="eventGuests"></div>
            </div>
        </div>

        <div class="form-container">
            <form id="requestForm">
                <div class="form-group">
                    <label for="songTitle">🎤 Titre de la chanson *</label>
                    <input type="text" id="songTitle" name="songTitle" required 
                           placeholder="Ex: Bohemian Rhapsody">
                </div>

                <div class="form-group">
                    <label for="artist">🎸 Artiste *</label>
                    <input type="text" id="artist" name="artist" required 
                           placeholder="Ex: Queen">
                </div>

                <div class="form-group">
                    <label for="userName">👤 Votre prénom *</label>
                    <input type="text" id="userName" name="userName" required 
                           placeholder="Ex: Marie">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Envoyer ma demande 🚀
                </button>
            </form>

            <div class="success-message" id="successMessage">
                ✅ Votre demande a été envoyée avec succès !<br>
                Le DJ la recevra dans quelques instants.
            </div>

            <div class="error-message" id="errorMessage">
                ❌ Une erreur est survenue. Veuillez réessayer.
            </div>
        </div>

        <div class="footer">
            Scannez le QR code pour accéder à cette page
        </div>
    </div>

    <script>
        // Récupérer l'ID de l'événement depuis l'URL (QR code)
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('event') || urlParams.get('eventId');

        // Charger les informations de l'événement
        async function loadEventInfo() {
            if (!eventId) return;
            
            try {
                const response = await fetch(`/.netlify/functions/events`);
                const data = await response.json();
                
                if (data.success) {
                    const event = data.data.find(e => e.id === eventId);
                    if (event) {
                        document.getElementById('eventName').textContent = event.name;
                        document.getElementById('eventDate').textContent = 
                            new Date(event.date).toLocaleDateString('fr-FR', {
                                weekday: 'long',
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });
                        const rawLocation = event.location;
                        const safeLocation = (rawLocation && String(rawLocation).trim().length > 0 && !['null','undefined','N/A'].includes(String(rawLocation).trim()))
                            ? String(rawLocation).trim()
                            : 'Lieu à confirmer';
                        const expected = Number((event.expectedGuests === 'null' || event.expectedGuests === 'undefined') ? NaN : event.expectedGuests);
                        const safeGuestsText = Number.isFinite(expected) && expected > 0
                            ? `${expected} invités attendus`
                            : `Nombre d'invités non précisé`;
                        const locEl = document.getElementById('eventLocation');
                        const guestsEl = document.getElementById('eventGuests');
                        if (locEl) locEl.textContent = `📍 ${safeLocation}`;
                        if (guestsEl) guestsEl.textContent = `👥 ${safeGuestsText}`;
                        document.getElementById('eventInfo').style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Erreur lors du chargement de l\'événement:', error);
            }
        }

        // Gérer la soumission du formulaire
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // Reset messages
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Envoi en cours...';
            
            try {
                const formData = new FormData(e.target);
                const requestData = {
                    eventId: eventId,
                    songTitle: formData.get('songTitle'),
                    artist: formData.get('artist'),
                    userName: formData.get('userName'),
                    userId: generateUserId()
                };
                
                const response = await fetch('/.netlify/functions/requests', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    successMessage.style.display = 'block';
                    e.target.reset();
                    
                    // Scroll vers le message de succès
                    successMessage.scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error(result.error || 'Erreur inconnue');
                }
                
            } catch (error) {
                console.error('Erreur:', error);
                errorMessage.textContent = `❌ ${error.message}`;
                errorMessage.style.display = 'block';
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Envoyer ma demande 🚀';
            }
        });

        // Générer un ID utilisateur unique (simple)
        function generateUserId() {
            return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Charger les infos de l'événement au démarrage
        loadEventInfo();
    </script>
</body>
</html>
