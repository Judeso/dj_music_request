[build]
  publish  = "public"
  functions = "netlify/functions"
  command  = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION  = "10"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[context.production.environment]
  NODE_ENV = "production"

[functions]
  external_node_modules = ["@netlify/neon"]
  node_bundler          = "esbuild"
